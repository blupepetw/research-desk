<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자 리서치 데스크</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E1C;
  --bg-glow-1:rgba(0,168,255,0.16);
  --bg-glow-2:rgba(112,0,255,0.14);
  --bg-glow-3:rgba(0,210,140,0.08);
  --surface:rgba(22,28,48,0.72);
  --surface-2:rgba(30,38,64,0.60);
  --surface-3:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.10);
  --border-soft:rgba(255,255,255,0.07);
  --text:#F1F5F9;
  --text-dim:#AAB4CC;
  --text-faint:#7681A0;
  --strong-buy:#FF5C7C;
  --strong-buy-bg:rgba(255,92,124,0.16);
  --buy:#FFB25E;
  --buy-bg:rgba(255,178,94,0.16);
  --watch:#5B93FF;
  --watch-bg:rgba(91,147,255,0.16);
  --neutral:#9BA5C4;
  --neutral-bg:rgba(155,165,196,0.14);
  --overview:#3CE0A1;
  --overview-bg:rgba(60,224,161,0.14);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'PretendardVariable','Pretendard',-apple-system,sans-serif;
  --hero-grad:linear-gradient(120deg,#00C8FF 0%,#3557C4 45%,#7000FF 100%);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.35),0 1px 1px rgba(0,0,0,0.25);
  --shadow-md:0 12px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04);
  --glow:0 14px 34px -6px rgba(0,200,255,0.28);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:
    radial-gradient(1100px circle at 12% -8%,var(--bg-glow-1),transparent 58%),
    radial-gradient(900px circle at 102% 6%,var(--bg-glow-2),transparent 55%),
    radial-gradient(800px circle at 40% 115%,var(--bg-glow-3),transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
}
::selection{background:var(--watch);color:#fff;}

/* ── Topbar ── */
.topbar{position:sticky;top:0;z-index:40;background:rgba(10,14,28,0.85);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--border);}
.topbar::before{content:'';display:block;height:4px;background:var(--hero-grad);}
.topbar-inner{max-width:1400px;margin:0 auto;padding:14px 28px 0;}
.title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--watch);background:var(--watch-bg);border-radius:999px;padding:4px 11px;}
.brand h1{font-size:21px;font-weight:800;}
.top-right{display:flex;align-items:center;gap:12px;}
.last-updated{font-size:12px;color:var(--text-faint);font-family:var(--mono);}
.refresh-btn{font-size:13px;font-weight:700;color:var(--watch);background:var(--watch-bg);border:1px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;transition:all .15s;}
.refresh-btn:hover{border-color:var(--watch);}

/* ── Tabs ── */
.tabbar{display:flex;gap:0;margin-bottom:0;}
.tab-btn{font-family:var(--sans);font-size:14.5px;font-weight:700;color:var(--text-faint);background:transparent;border:none;padding:9px 4px;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;transition:color .15s;}
.tab-btn+.tab-btn{margin-left:20px;}
.tab-count{font-family:var(--mono);font-size:11px;background:var(--surface-3);color:var(--text-dim);padding:1px 7px;border-radius:999px;}
.tab-btn.active{color:var(--text);border-bottom-color:var(--strong-buy);}
.tab-btn[data-tab="overview"].active{border-bottom-color:var(--overview);}

/* ── Controls ── */
.controls-bar{max-width:1400px;margin:0 auto;padding:16px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;flex:1 1 220px;min-width:180px;max-width:340px;}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px 9px 34px;color:var(--text);font-size:14px;font-family:var(--sans);}
.search-box input::placeholder{color:var(--text-faint);}
.search-box input:focus{outline:none;border-color:var(--watch);}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;}
.count-note{font-size:12.5px;color:var(--text-faint);font-family:var(--mono);margin-left:auto;}

/* filter pills */
.filter-pills{display:flex;gap:7px;flex-wrap:wrap;}
.fpill{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 9px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);transition:all .15s;user-select:none;}
.fpill:hover{border-color:var(--text-dim);}
.fpill.active{border-color:currentColor;}
.fpill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.fpill .fn{font-family:var(--mono);font-weight:800;}
.fpill.all{color:var(--text);} .fpill.all .dot{background:var(--text-faint);} .fpill.all.active{background:var(--surface-3);}
.fpill.sb{color:var(--strong-buy);} .fpill.sb .dot{background:var(--strong-buy);} .fpill.sb.active{background:var(--strong-buy-bg);}
.fpill.b{color:var(--buy);} .fpill.b .dot{background:var(--buy);} .fpill.b.active{background:var(--buy-bg);}
.fpill.w{color:var(--watch);} .fpill.w .dot{background:var(--watch);} .fpill.w.active{background:var(--watch-bg);}
.fpill.n{color:var(--neutral);} .fpill.n .dot{background:var(--neutral);} .fpill.n.active{background:var(--neutral-bg);}

/* ── Wrap / Views ── */
.wrap{max-width:1400px;margin:0 auto;padding:0 28px 80px;}
.view{display:none;}
.view.active{display:block;}

/* ── Research cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start;}
.card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:16px;overflow:hidden;transition:all .2s;box-shadow:var(--shadow-sm);}
.card:hover{border-color:rgba(0,200,255,0.35);box-shadow:var(--glow);transform:translateY(-2px);}
.card.g-진입완료{border-top-color:var(--strong-buy);}
.card.g-타점대기{border-top-color:var(--buy);}
.card.g-관찰중{border-top-color:var(--watch);}

.card-head{padding:14px 16px 12px;cursor:pointer;}
.head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.name{font-size:17px;font-weight:800;}
.ticker-txt{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin-top:2px;}
.badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;color:#fff;flex-shrink:0;}
.badge.진입완료{background:var(--strong-buy);}
.badge.타점대기{background:var(--buy);color:#1a1a1a;}
.badge.관찰중{background:var(--watch);}
.badge.미분류{background:var(--neutral);}
.badge.ov{background:var(--overview);color:#0a1a10;font-family:var(--mono);}

.conc-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px 13px;margin-bottom:10px;}
.conc-lbl{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.conc-txt{font-size:13.5px;line-height:1.6;color:var(--text);}

.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-faint);font-family:var(--mono);padding-top:8px;border-top:1px solid var(--border-soft);flex-wrap:wrap;gap:5px;}
.vtag{padding:3px 8px;border-radius:999px;font-weight:700;color:#fff;font-size:11.5px;}
.vtag.완료{background:#1FAA6B;}
.vtag.부분검증{background:#DDA22E;}
.vtag.검증대기{background:#E2703D;}
.vtag.미검증{background:var(--neutral);}

/* expanded body */
.card-body{display:none;border-top:1px solid var(--border);background:var(--surface-2);padding:18px 20px 22px;}
.card-body.open{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;}
@media(max-width:860px){.card-body.open{grid-template-columns:1fr;}}
.sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.sec h4::before{content:'';width:3px;height:11px;background:var(--text-faint);border-radius:2px;flex-shrink:0;}
.plain{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:13px;font-size:13.5px;line-height:1.78;color:var(--text);white-space:pre-wrap;}

.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:13px;}
.pi .pl{font-size:11px;color:var(--text-faint);}
.pi .pv{font-family:var(--mono);font-size:15px;font-weight:800;margin-top:2px;}
.pi.floor .pv{color:var(--watch);}
.pi.stop .pv{color:var(--text-faint);}
.pi.buy .pv{color:var(--buy);}
.pi.tgt .pv{color:var(--strong-buy);}

.met-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:9px;}
.met{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;}
.met .ml{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.met .mv{font-family:var(--mono);font-size:16px;font-weight:800;margin-top:3px;}

/* ── Overview cards ── */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
.ov-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--overview);border-radius:16px;overflow:hidden;transition:all .2s;box-shadow:var(--shadow-sm);}
.ov-card:hover{border-color:rgba(60,224,161,0.35);box-shadow:0 14px 34px -6px rgba(60,224,161,0.18);transform:translateY(-2px);}
.ov-head{padding:14px 16px 12px;cursor:pointer;}
.ov-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.ov-biz{font-size:13px;color:var(--text-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ov-foot{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:7px;}

.ov-body{display:none;border-top:1px solid var(--border);background:var(--surface-2);padding:16px 18px 20px;}
.ov-body.open{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
@media(max-width:800px){.ov-body.open{grid-template-columns:1fr;}}
.ov-sec h5{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--overview);font-weight:800;margin-bottom:7px;}
.ov-txt{font-size:13.5px;line-height:1.75;color:var(--text);white-space:pre-wrap;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:11px 13px;}
.ov-src{margin-top:8px;font-size:11.5px;color:var(--text-faint);font-family:var(--mono);word-break:break-all;}

/* ── Loading / empty ── */
.loading{text-align:center;padding:72px 20px;color:var(--text-faint);font-family:var(--mono);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--watch);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:60px 20px;color:var(--text-faint);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="title-row">
      <div class="brand">
        <span class="brand-mark">LIVE</span>
        <h1>투자 리서치 데스크</h1>
      </div>
      <div class="top-right">
        <span class="last-updated" id="lastUpdated">불러오는 중…</span>
        <button class="refresh-btn" onclick="loadAll()">↻ 새로고침</button>
      </div>
    </div>
    <div class="tabbar">
      <button class="tab-btn active" data-tab="research">종목리서치 <span class="tab-count" id="cntR">-</span></button>
      <button class="tab-btn" data-tab="overview">기업개요 <span class="tab-count" id="cntO">-</span></button>
    </div>
  </div>
</div>

<div class="controls-bar" id="ctrlR">
  <div class="search-box">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="srchR" placeholder="종목명·티커 검색…" oninput="filterR()">
  </div>
  <div class="filter-pills">
    <div class="fpill all active" data-g="all" onclick="setG(this)"><span class="dot"></span><span class="fn" id="nAll">0</span> 전체</div>
    <div class="fpill sb" data-g="진입완료" onclick="setG(this)"><span class="dot"></span><span class="fn" id="nEntry">0</span> 진입완료</div>
    <div class="fpill b"  data-g="타점대기" onclick="setG(this)"><span class="dot"></span><span class="fn" id="nWait">0</span> 타점대기</div>
    <div class="fpill w"  data-g="관찰중"   onclick="setG(this)"><span class="dot"></span><span class="fn" id="nWatch">0</span> 관찰중</div>
    <div class="fpill n"  data-g="미분류"   onclick="setG(this)"><span class="dot"></span><span class="fn" id="nNone">0</span> 미분류</div>
  </div>
  <span class="count-note" id="noteR"></span>
</div>

<div class="controls-bar" id="ctrlO" style="display:none;">
  <div class="search-box">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="srchO" placeholder="종목명 검색…" oninput="filterO()">
  </div>
  <span class="count-note" id="noteO"></span>
</div>

<div class="wrap">
  <div class="view active" id="view-research">
    <div class="loading" id="ldR"><div class="spinner"></div>구글시트에서 불러오는 중…</div>
    <div class="grid" id="gridR" style="display:none;"></div>
    <div class="empty" id="emptyR" style="display:none;">검색 결과가 없습니다</div>
  </div>
  <div class="view" id="view-overview">
    <div class="loading" id="ldO"><div class="spinner"></div>구글시트에서 불러오는 중…</div>
    <div class="ov-grid" id="gridO" style="display:none;"></div>
    <div class="empty" id="emptyO" style="display:none;">검색 결과가 없습니다</div>
  </div>
</div>

<script>
// ── URL ──
const URL_R = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRP7MbSs5eamVDZi5DBy9MC83ZsfMN60XNfmO7MI9csNlLUw5UeDLFoiL4aSQR9ww_jm28knxM98Gp2/pub?gid=1334730446&single=true&output=csv';
const URL_O = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRP7MbSs5eamVDZi5DBy9MC83ZsfMN60XNfmO7MI9csNlLUw5UeDLFoiL4aSQR9ww_jm28knxM98Gp2/pub?gid=147161473&single=true&output=csv';

let dataR = [], dataO = [], activeG = 'all';

// ── CSV 파서 ──
function parseCSV(txt) {
  const lines = txt.split('\n');
  if (!lines.length) return [];
  const headers = parseLine(lines[0]);
  return lines.slice(1).map(l => {
    const v = parseLine(l);
    const obj = {};
    headers.forEach((h,i) => obj[h.trim()] = (v[i]||'').trim());
    return obj;
  }).filter(r => Object.values(r).some(v=>v));
}
function parseLine(line) {
  const res=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
    else if(c===','&&!q){res.push(cur);cur='';}
    else cur+=c;
  }
  res.push(cur); return res;
}

// ── 헬퍼 ──
function fmtPrice(v){const n=parseFloat(String(v).replace(/,/g,''));return(!v||isNaN(n))?'-':n.toLocaleString('ko-KR')+'원';}
function fmtNum(v,sfx=''){const n=parseFloat(v);return(!v||isNaN(n))?'-':n.toFixed(2)+sfx;}
function grade(status){
  if(!status)return'미분류';
  if(status.includes('진입'))return'진입완료';
  if(status.includes('타점'))return'타점대기';
  if(status.includes('관찰'))return'관찰중';
  return'미분류';
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escPre(s){return esc(s||'');}

// ── 탭 ──
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab=btn.dataset.tab;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+tab).classList.add('active');
    document.getElementById('ctrlR').style.display=tab==='research'?'':'none';
    document.getElementById('ctrlO').style.display=tab==='overview'?'':'none';
  });
});

// ── 종목리서치 ──
// 실제 헤더:
// 리서치일자 종목명 티커 투자포인트/아이디어 재무·밸류에이션 리스크 요인 촉매(이슈·이벤트) 경쟁사 비교
// 결론 펀더멘탈바닥(원) 손절가(원) 2차매수가(원) 1차매수가(원) 목표가(원)
// 최종수정일 데이터검증상태 최신여부(자동) 재확인예정일 재검증순번(자동) 일자내순번(자동) 매매상태 (빈칸)
// 최초결론(자동) 최근결론(자동) 결론 변경사유 Fwd PER(배) PBR(배) CAGR(%) PEG(배) FCF Yield(%)

const R = {
  name:   r => r['종목명']||'',
  ticker: r => r['티커']||'',
  d:      r => r['투자포인트/아이디어']||'',
  e:      r => r['재무·밸류에이션']||'',
  f:      r => r['리스크 요인']||'',
  g:      r => r['촉매(이슈·이벤트)']||'',
  h:      r => r['경쟁사 비교']||'',
  conclusion: r => r['결론']||'',
  firstConc:  r => r['최초결론(자동)']||'',
  recentConc: r => r['최근결론(자동)']||'',
  reason:     r => r['결론 변경사유']||'',
  floor:  r => r['펀더멘탈바닥(원)']||'',
  stop:   r => r['손절가(원)']||'',
  buy2:   r => r['2차매수가(원)']||'',
  buy1:   r => r['1차매수가(원)']||'',
  target: r => r['목표가(원)']||'',
  lastmod:r => r['최종수정일']||'',
  verify: r => r['데이터검증상태']||'',
  status: r => r['매매상태']||'',
  fwdper: r => r['Fwd PER(배)']||'',
  pbr:    r => r['PBR(배)']||'',
  cagr:   r => r['CAGR(%)']||'',
  peg:    r => r['PEG(배)']||'',
  fcf:    r => r['FCF Yield(%)']||'',
};

function renderR(data){
  dataR = data.filter(r=>R.name(r));
  const cnt={all:0,'진입완료':0,'타점대기':0,'관찰중':0,'미분류':0};
  dataR.forEach(r=>{cnt.all++;const g=grade(R.status(r));cnt[g]=(cnt[g]||0)+1;});
  document.getElementById('nAll').textContent=cnt.all;
  document.getElementById('nEntry').textContent=cnt['진입완료']||0;
  document.getElementById('nWait').textContent=cnt['타점대기']||0;
  document.getElementById('nWatch').textContent=cnt['관찰중']||0;
  document.getElementById('nNone').textContent=cnt['미분류']||0;
  document.getElementById('cntR').textContent=cnt.all;
  filterR();
}

function filterR(){
  const q=(document.getElementById('srchR').value||'').toLowerCase();
  const filtered=dataR.filter(r=>{
    const matchQ=!q||R.name(r).toLowerCase().includes(q)||R.ticker(r).toLowerCase().includes(q);
    const matchG=activeG==='all'||grade(R.status(r))===activeG;
    return matchQ&&matchG;
  });
  const grid=document.getElementById('gridR');
  grid.innerHTML='';
  document.getElementById('noteR').textContent=filtered.length+'개 종목';
  document.getElementById('emptyR').style.display=filtered.length?'none':'block';
  grid.style.display=filtered.length?'':'none';

  filtered.forEach((r,idx)=>{
    const g=grade(R.status(r));
    const conc=R.recentConc(r)||R.conclusion(r);
    const verify=R.verify(r);
    const lm=R.lastmod(r).replace(/\s.*/,'');

    const card=document.createElement('div');
    card.className=`card g-${g}`;
    card.innerHTML=`
<div class="card-head" onclick="toggleR(${idx})">
  <div class="head-top">
    <div><div class="name">${esc(R.name(r))}</div><div class="ticker-txt">${esc(R.ticker(r))}</div></div>
    <span class="badge ${g}">${g}</span>
  </div>
  ${conc?`<div class="conc-box"><div class="conc-lbl">최근 결론</div><div class="conc-txt">${esc(conc)}</div></div>`:''}
  <div class="meta-row">
    <span>${lm||'-'}</span>
    ${verify?`<span class="vtag ${verify}">${verify}</span>`:''}
  </div>
</div>
<div class="card-body" id="rb-${idx}">
  <div class="sec"><h4>투자 포인트</h4><div class="plain">${escPre(R.d(r))}</div></div>
  <div class="sec"><h4>리스크 요인</h4><div class="plain">${escPre(R.f(r))}</div></div>
  <div class="sec"><h4>재무 · 밸류에이션</h4><div class="plain">${escPre(R.e(r))}</div></div>
  <div class="sec"><h4>촉매 · 이벤트</h4><div class="plain">${escPre(R.g(r))}</div></div>
  <div class="sec"><h4>경쟁사 비교</h4><div class="plain">${escPre(R.h(r))}</div></div>
  <div class="sec">
    <h4>가격 레벨</h4>
    <div class="price-grid">
      <div class="pi floor"><div class="pl">펀더멘탈 바닥</div><div class="pv">${fmtPrice(R.floor(r))}</div></div>
      <div class="pi stop"><div class="pl">손절가</div><div class="pv">${fmtPrice(R.stop(r))}</div></div>
      <div class="pi buy"><div class="pl">2차 매수가</div><div class="pv">${fmtPrice(R.buy2(r))}</div></div>
      <div class="pi buy"><div class="pl">1차 매수가</div><div class="pv">${fmtPrice(R.buy1(r))}</div></div>
      <div class="pi tgt" style="grid-column:1/-1"><div class="pl">목표가</div><div class="pv">${fmtPrice(R.target(r))}</div></div>
    </div>
    <div class="met-grid">
      <div class="met"><div class="ml">Fwd PER</div><div class="mv">${fmtNum(R.fwdper(r),'x')}</div></div>
      <div class="met"><div class="ml">PBR</div><div class="mv">${fmtNum(R.pbr(r),'x')}</div></div>
      <div class="met"><div class="ml">PEG</div><div class="mv">${fmtNum(R.peg(r),'x')}</div></div>
      <div class="met"><div class="ml">CAGR</div><div class="mv">${fmtNum(R.cagr(r),'%')}</div></div>
      <div class="met"><div class="ml">FCF Yield</div><div class="mv">${fmtNum(R.fcf(r),'%')}</div></div>
    </div>
  </div>
  ${R.firstConc(r)?`<div class="sec"><h4>최초 결론</h4><div class="plain">${escPre(R.firstConc(r))}</div></div>`:''}
  ${R.reason(r)?`<div class="sec"><h4>결론 변경 사유</h4><div class="plain">${escPre(R.reason(r))}</div></div>`:''}
</div>`;
    grid.appendChild(card);
  });
}

function toggleR(idx){
  const b=document.getElementById('rb-'+idx);
  if(b)b.classList.toggle('open');
}
function setG(el){
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  activeG=el.dataset.g;
  filterR();
}

// ── 기업개요 ──
// 헤더: 종목명 티커 주력사업/제품 주요매출처/고객 피어그룹·시장지위 방향성(R&D·투자포커스)
//       지배구조·승계 현황 오너·경영진 방향성 숫자의 함정 시간축 분리 최종갱신일 출처

const O = {
  name:   r => r['종목명']||'',
  ticker: r => r['티커']||'',
  biz:    r => r['주력사업/제품']||'',
  client: r => r['주요매출처/고객']||'',
  peer:   r => r['피어그룹·시장지위']||'',
  dir:    r => r['방향성(R&D·투자포커스)']||'',
  gov:    r => r['지배구조·승계 현황']||'',
  mgmt:   r => r['오너·경영진 방향성']||'',
  trap:   r => r['숫자의 함정']||'',
  time:   r => r['시간축 분리']||'',
  updated:r => r['최종갱신일']||'',
  src:    r => r['출처']||'',
};

function renderO(data){
  dataO=data.filter(r=>O.name(r));
  document.getElementById('cntO').textContent=dataO.length;
  filterO();
}

function filterO(){
  const q=(document.getElementById('srchO').value||'').toLowerCase();
  const filtered=dataO.filter(r=>!q||O.name(r).toLowerCase().includes(q));
  const grid=document.getElementById('gridO');
  grid.innerHTML='';
  document.getElementById('noteO').textContent=filtered.length+'개 종목';
  document.getElementById('emptyO').style.display=filtered.length?'none':'block';
  grid.style.display=filtered.length?'':'none';

  filtered.forEach((r,idx)=>{
    const secs=[
      {label:'주력사업·제품',val:O.biz(r)},
      {label:'주요매출처·고객',val:O.client(r)},
      {label:'피어그룹·시장지위',val:O.peer(r)},
      {label:'방향성 (R&D·투자)',val:O.dir(r)},
      {label:'지배구조·승계',val:O.gov(r)},
      {label:'오너·경영진 방향성',val:O.mgmt(r)},
      {label:'숫자의 함정',val:O.trap(r)},
      {label:'시간축 분리',val:O.time(r)},
    ].filter(s=>s.val);

    const bodyHTML=secs.map(s=>`<div class="ov-sec"><h5>${s.label}</h5><div class="ov-txt">${escPre(s.val)}</div></div>`).join('');
    const src=O.src(r);
    const srcHTML=src?`<div class="ov-src">출처: ${src.startsWith('http')?`<a href="${esc(src)}" target="_blank" style="color:var(--watch);">링크 열기</a>`:esc(src)}</div>`:'';

    const card=document.createElement('div');
    card.className='ov-card';
    card.innerHTML=`
<div class="ov-head" onclick="toggleO(${idx})">
  <div class="ov-top">
    <div><div class="name">${esc(O.name(r))}</div><div class="ticker-txt">${esc(O.ticker(r))}</div></div>
    <span class="badge ov">기업개요</span>
  </div>
  <div class="ov-biz">${esc(O.biz(r)||'-')}</div>
  <div class="ov-foot">갱신: ${esc(O.updated(r)||'-')}</div>
</div>
<div class="ov-body" id="ob-${idx}">
  ${bodyHTML}
  ${srcHTML}
</div>`;
    grid.appendChild(card);
  });
}

function toggleO(idx){
  const b=document.getElementById('ob-'+idx);
  if(b)b.classList.toggle('open');
}

// ── 로드 ──
async function loadAll(){
  document.getElementById('lastUpdated').textContent='불러오는 중…';

  // Research
  document.getElementById('ldR').style.display='block';
  document.getElementById('gridR').style.display='none';
  try{
    const csv=await(await fetch(URL_R)).text();
    renderR(parseCSV(csv));
    document.getElementById('ldR').style.display='none';
    document.getElementById('gridR').style.display='';
  }catch(e){document.getElementById('ldR').innerHTML=`<div style="color:var(--strong-buy)">로드 실패: ${e.message}</div>`;}

  // Overview
  document.getElementById('ldO').style.display='block';
  document.getElementById('gridO').style.display='none';
  try{
    const csv=await(await fetch(URL_O)).text();
    renderO(parseCSV(csv));
    document.getElementById('ldO').style.display='none';
    document.getElementById('gridO').style.display='';
  }catch(e){document.getElementById('ldO').innerHTML=`<div style="color:var(--strong-buy)">로드 실패: ${e.message}</div>`;}

  const now=new Date();
  document.getElementById('lastUpdated').textContent=
    now.toLocaleDateString('ko-KR')+' '+now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 기준';
}

loadAll();
</script>
